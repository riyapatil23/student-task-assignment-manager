# Server Port
server.port=8080

# Application Name
spring.application.name=CampusTask-Backend

# MySQL Database DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/student_task_manager?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Deadline Reminder Scheduler Configuration
# Check for upcoming assignment deadlines every 60 seconds (60,000 ms)
app.reminder.cron=0 * * * * *
app.reminder.hours-before=24
